# SEE docker-compose-withenvoy.yml
# https://blog.logrocket.com/containerized-development-nestjs-docker/
# This is used by yarn start:deps:indocker
version: '3.7'

services:
  envoy:
    container_name: ecoloop-envoy-onprem
    image: envoyproxy/envoy-dev:a240824c376693b16ca8be51e435b95c42f3449f
    depends_on:
      - ecoloop-web
      - ecoloop-server
    networks:
      - webnet
    ports:
      - "9901:9901"
      - "${PROXY_EXPOSE_PORT}:80"
    volumes:
      - ${ENVOY_FILE}:/etc/envoy/envoy.yaml

  ecoloop-server:
    container_name: ecoloop-server-onprem
    image: ${ECOLOOP_SERVER_IMAGE}
    volumes:
      - ${SEED_DATA_CONNECTORS_LOCATION}:/usr/src/app/seed-data/connectors
      - ${STORAGE_LOCATION_ROOT}:${STORAGE_LOCATION_ROOT}
    ports:
      - ${ECOLOOP_SERVER_EXPOSE_PORT}:3000
    command: >
      sh -c "./wait-for.sh postgres:5432 -- yarn prisma migrate deploy
      && yarn start:prod"
    env_file:
      - .env.docker-server
    environment:
      # PORT: 80
      NODE_ENV: ${SERVER_NODE_ENV}
      CIPHER_KEY: ${CIPHER_KEY}
      STORAGE_LOCATION_ROOT: ${STORAGE_LOCATION_ROOT}
      LLM_OPENAPI_API_KEY: ${OPENAI_API_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH0_ISSUER_URL: ${AUTH0_ISSUER_URL}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      HL_DISABLE_GENAI: true
    networks:
      - app_network
    depends_on:
      - postgres
      - ecoloop-ml
      # - minio
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres-onprem
    # command: postgres -c 'max_connections=200' -c 'shared_buffers=256MB'
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      # POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8' COMMENTED OUT AS prisma db:migrate is failing (maybe since pg 15 ??)
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
      PG_DATA: /var/lib/postgresql/data
    networks:
      - app_network
    ports:
      - 5432:5432
    volumes:
      - ${DBDATA_LOCATION_ROOT}:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
    command: mosquitto -c /mosquitto-no-auth.conf
    # volumes:
    #   - ${MOSQUITTO_ROOT:-../infrastructure/mqtt}:/mosquitto
    networks:
      - webnet
    profiles: ["mqtt"]

  # Use FS for local test
  # minio:
  #   image: 'bitnami/minio:latest'
  #   container_name: el-minio-test
  #   ports:
  #     - '9000:9000'
  #     - '9001:9001'
  #   environment:
  #     - MINIO_ROOT_USER=minio-root-user
  #     - MINIO_ROOT_PASSWORD=minio-root-password
  #   networks:
  #     - webnet
  ecoloop-ml:
    image: ${ECOLOOP_ML_IMAGE}
    container_name: ecoloop-ml-onprem
    environment:
      PORT: "80"
      SERVER_BAPI: http://ecoloop-server-onprem:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLAMA_PARSE_API_KEY: ${LLAMA_PARSE_API_KEY}
    ports:
      - ${ECOLOOP_ML_EXPOSE_PORT}:80
    networks:
      - app_network
  ecoloop-web:
    container_name: ecoloop-web-onprem
    image: ${ECOLOOP_WEB_IMAGE}
    env_file:
      - .env.docker-web
    environment:
      PORT: 80
      NODE_ENV: ${WEB_NODE_ENV}
      BAPI_BASE_URL: ${BAPI_BASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_ISSUER_URL: ${AUTH0_ISSUER_URL}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_SECRET: ${AUTH0_SECRET}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}

    networks:
      - app_network
    ports:
      - ${ECOLOOP_WEB_EXPOSE_PORT}:80
    depends_on:
      - ecoloop-server

networks:
  app_network:
    driver: bridge

volumes:
  pgdata_onprem:
